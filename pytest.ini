[pytest]
testpaths = tests
pythonpath = .

# Copied from Caliber's own arrangement (api/pyproject.toml): the marked tests
# need a live PostgreSQL, so they are excluded from the default run and
# `python -m pytest -q` needs no service, no credential and no network.
# Run them with: python -m pytest -m postgres   (needs POC_TEST_DATABASE_URL)
addopts = -m "not postgres"
markers =
    postgres: needs a live PostgreSQL; excluded from the default run
